name: Build OT Watchdog ZIP

on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 "Version:" ot-watchdog.php | sed 's/.*Version: *//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare plugin folder
        run: |
          mkdir -p dist/ot-watchdog
          git archive HEAD -- . ":(exclude).github" | tar -x -C dist/ot-watchdog

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ot-watchdog-v${{ env.VERSION }}
          path: dist/
          compression-level: 9
