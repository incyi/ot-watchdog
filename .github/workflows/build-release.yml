name: Build OT Watchdog ZIP & Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # গুরুত্বপূর্ণ: tags needed for versioning

      - name: Fetch all tags from remote
        run: |
          git fetch origin --tags --force

      - name: Get last tag
        id: last_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Found last tag: $TAG"

      - name: Increment version
        id: version
        run: |
          TAG=${{ steps.last_tag.outputs.TAG }}
          VERSION=${TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION, New tag: $NEW_TAG"

      - name: Update version files
        run: |
          NEW_VERSION=${{ steps.version.outputs.VERSION }}
          NEW_TAG=${{ steps.version.outputs.TAG }}
          NOW=$(date '+%Y-%m-%d %H:%M:%S')

          # Update ot-watchdog.php - Version in header
          sed -i "s/ \* Version: .*/ * Version: $NEW_VERSION/" ot-watchdog.php

          # Update ot-watchdog.php - Version constant
          sed -i "s/define('OT_WATCHDOG_VERSION', .*/define('OT_WATCHDOG_VERSION', '$NEW_VERSION');/" ot-watchdog.php

          # Update composer.json
          sed -i "s/\"version\": .*/\"version\": \"$NEW_VERSION\",/" composer.json

          # Update updates.json
          sed -i "s/\"version\": .*/\"version\": \"$NEW_VERSION\",/" updates.json

          sed -i "s|\"download_url\": .*|\"download_url\": \"https://github.com/incyi/ot-watchdog/releases/download/$NEW_TAG/ot-watchdog-$NEW_VERSION.zip\",|" updates.json

          sed -i "s|\"changelog\": .*|\"changelog\": \"https://github.com/incyi/ot-watchdog/releases/tag/$NEW_TAG\"|" updates.json

          sed -i "s/\"last_updated\": .*/\"last_updated\": \"$NOW\",/" updates.json

          # Update docs/update-info.json
          sed -i "s/\"version\": .*/\"version\": \"$NEW_VERSION\",/" docs/update-info.json

          sed -i "s|\"download_url\": .*|\"download_url\": \"https://github.com/incyi/ot-watchdog/releases/download/$NEW_TAG/ot-watchdog-$NEW_VERSION.zip\"|" docs/update-info.json

      - name: Prepare plugin folder
        run: |
          mkdir -p dist/ot-watchdog
          git archive HEAD -- . ":(exclude).github" | tar -x -C dist/ot-watchdog

      - name: Create zip
        run: |
          cd dist
          zip -r ot-watchdog-${{ steps.version.outputs.VERSION }}.zip ot-watchdog

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ot-watchdog.php composer.json updates.json docs/update-info.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"

      - name: Create and push tag
        run: |
          NEW_TAG=${{ steps.version.outputs.TAG }}
          
          # Check if tag exists on remote using git ls-remote
          if git ls-remote origin "refs/tags/$NEW_TAG" | grep -q "$NEW_TAG"; then
            echo "Tag $NEW_TAG already exists on remote. Skipping tag creation."
            exit 0
          fi
          
          # Tag doesn't exist, create and push it
          git tag "$NEW_TAG"
          git push origin main || echo "No new commits to push"
          git push origin "$NEW_TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: dist/ot-watchdog-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Pages deployment
        run: |
          gh workflow run deploy-docs.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}