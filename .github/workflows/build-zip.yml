name: Build OT Watchdog ZIP

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clean build folder
        run: |
          mkdir ot-watchdog

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            ./ ot-watchdog/

      - name: Create ZIP
        run: |
          zip -r ot-watchdog.zip ot-watchdog

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ot-watchdog-plugin
          path: ot-watchdog.zip

      - name: Inspect ZIP contents (debug)
        run: |
          echo "=== ZIP CONTENTS ==="
          unzip -l ot-watchdog.zip

          echo "=== DIRECTORY STRUCTURE ==="
          ls -R ot-watchdog || true
