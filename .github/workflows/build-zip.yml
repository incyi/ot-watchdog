name: Build & Release OT Watchdog

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from plugin file
        id: version
        run: |
          VERSION=$(grep "Version:" ot-watchdog.php | head -n1 | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Prepare build folder
        run: |
          mkdir build
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            ./ build/

      - name: Create ZIP
        run: |
          cd build
          zip -r ot-watchdog.zip .

      - name: Rename ZIP with version
        run: |
          mv build/ot-watchdog.zip build/ot-watchdog-${{ env.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OT Watchdog v${{ env.VERSION }}
          files: build/ot-watchdog-${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}