name: Build OT Watchdog ZIP

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # CREATE CLEAN WORDPRESS ZIP
      # =========================
      - name: Create plugin ZIP (git archive)
        run: |
          git archive --format=zip --prefix=ot-watchdog/ HEAD -o ot-watchdog.zip

      # =========================
      # DEBUG: CHECK ZIP CONTENTS
      # =========================
      - name: Inspect ZIP contents
        run: |
          echo "=== ZIP CONTENTS ==="
          unzip -l ot-watchdog.zip

      # =========================
      # VERIFY REPO STRUCTURE
      # =========================
      - name: Verify repo structure
        run: |
          echo "=== REPO STRUCTURE ==="
          ls -R

      # =========================
      # UPLOAD ARTIFACT
      # =========================
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ot-watchdog-plugin
          path: ot-watchdog.zip